name: Auto-Generate README

on:
  push:
    branches:
      - main
      - dev
      - '**'

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install tree command (required to list folders)
      - name: Install tree utility
        run: sudo apt-get update && sudo apt-get install -y tree

      # Generate ACTUAL folder structure
      - name: Generate folder tree
        run: |
          echo "📁 Project Folder Structure" > folder_structure.txt
          echo "--------------------------" >> folder_structure.txt
          tree -a -I '.git|.github|__pycache__|.venv' >> folder_structure.txt

      # Upload folder_structure.txt so you can inspect it
      - name: Upload folder_structure.txt for debugging
        uses: actions/upload-artifact@v4
        with:
          name: folder-structure
          path: folder_structure.txt

      - name: Install OpenAI SDK
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install openai

      - name: Generate README using OpenAI GPT
        run: |
          python3 - << 'EOF'
          import os
          import openai

          openai.api_key = os.getenv("OPENAI_API_KEY")

          with open("folder_structure.txt") as f:
              folder_tree = f.read()

          prompt = f"""
                  You are an expert technical writer, software architect, and developer advocate.
                  Generate a **highly detailed, project-specific README.md** for THIS repository.

                  ====================================================================
                  ## PROJECT CONTEXT
                  ====================================================================

                  ### Repository Name
                  talk-to-my-data

                  ### Project Name
                  Convert the repo name into a human-friendly title:
                  Use exactly: **"Talk to My Data"**

                  ### Technology Focus
                  - This project is designed to work with **Snowflake** (not a generic database)
                  - It includes an **LLM agent** capable of interacting with Snowflake
                  - Requirements should be inferred from the folder structure and requirements.txt

                  ### Environment Setup Requirements
                  README MUST explain:
                  - How to configure `configs/dev.env`
                  - What each environment variable means
                  - Provide a full example block of a valid dev.env:

                  ```
                  SNOWFLAKE_ACCOUNT=your_account
                  SNOWFLAKE_USER=your_user
                  SNOWFLAKE_PASSWORD=your_password
                  SNOWFLAKE_ROLE=your_role
                  SNOWFLAKE_DATABASE=your_db
                  SNOWFLAKE_SCHEMA=public
                  SNOWFLAKE_WAREHOUSE=your_wh
                  OPENAI_API_KEY=your_api_key
                  ```

                  ### Folder Structure (REAL, NOT HALLUCINATED)
                  Use the actual folder structure below to infer purpose, content, and architecture.

                  FOLDER STRUCTURE:
                  {folder_tree}

                  ====================================================================
                  ## README REQUIREMENTS
                  ====================================================================

                  The README MUST include EVERY ONE of these sections in detail:

                  ### 1. Project Name
                  - Use **Talk to My Data**

                  ### 2. Project Overview
                  - Deduce purpose based on folders such as src/, utils/, configs/
                  - Describe as an LLM-driven Snowflake query and interaction framework

                  ### 3. Features
                  - Capabilities inferred from db_connector.py, llm_agent.py, utilities, and scripts

                  ### 4. Architecture Summary
                  Explain major components:
                  - `src/main_app.py` – main entrypoint
                  - `src/db_connector.py` – Snowflake connector logic
                  - `src/llm_agent.py` – LLM interface & query agent
                  - `utils/` – configuration loader, helpers, tree generator
                  - `configs/settings.yml` – configuration mapping
                  - `configs/dev.env` – environment variable store
                  - `scripts/*.ps1` – operational automation scripts
                  - `.github/workflows` – automated README generation

                  ### 5. Folder Structure Explanation
                  Describe purpose of each:
                  - configs/
                  - sandbox/ (should be described as scratch area, not real tests)
                  - scripts/
                  - src/
                  - utils/
                  - requirements.txt
                  - bundle.yaml
                  - .github/workflows/

                  ### 6. Setup Instructions
                  Include:
                  - Python version requirement
                  - Creating virtual environment
                  - Installing dependencies from requirements.txt
                  - Setting up dev.env
                  - Verifying Snowflake connectivity

                  ### 7. Running the Application
                  Explain:
                  - Running via python: `python src/main_app.py`
                  - Running via PowerShell: `scripts/run_local.ps1`
                  - How environment variables are loaded

                  ### 8. Description of configs/
                  - Explain settings.yml
                  - Explain dev.env variables and usage

                  ### 9. Description of utils/
                  - Summaries of config_loader.py, generate_tree.py, helper.py

                  ### 10. Description of sandbox/
                  - Clarify it is not a test suite
                  - Used for experiments, scratch development, trial scripts

                  ### 11. Example Usage
                  Provide:
                  - A Snowflake query example handled by the LLM agent
                  - A CLI example or function call example
                  - A simple workflow example

                  ### 12. Contribution Guidelines
                  Include:
                  - Basic branching strategy
                  - Expectations for PRs
                  - Naming conventions
                  - How to add new modules

                  ### 13. License Section
                  Include a placeholder if no license is committed.

                  ====================================================================
                  ## FINAL INSTRUCTIONS
                  ====================================================================

                  - Produce a **polished, professional README.md**.
                  - The README MUST be **specific to THIS repository**, using the actual folder structure.
                  - DO NOT hallucinate directories, components, or technologies.
                  - DO NOT generate a generic template.
                  - Use clear Markdown formatting with headers, lists, and code blocks.
                  - README must read like production-grade documentation.

          """

          completion = openai.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}]
          )

          output = completion.choices[0].message.content

          with open("README.md", "w") as f:
              f.write(output)
          EOF

      - name: Commit README.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi

          git add README.md
          git commit -m "Auto-update README via GPT"
          git push