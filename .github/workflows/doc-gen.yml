name: Auto-Generate README

on:
  push:
    branches:
      - main
      - dev
      - '**'

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate folder tree
        run: |
          echo "📁 Project Folder Structure" > folder_structure.txt
          echo "--------------------------" >> folder_structure.txt
      - name: Install OpenAI SDK
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install openai

      - name: Generate README using OpenAI GPT
        id: generate_readme
        run: |
          python3 - << 'EOF'
          import os, openai

          openai.api_key = os.getenv("OPENAI_API_KEY")

          with open("folder_structure.txt") as f:
              folder_tree = f.read()

          prompt = f"""
          You are an expert software documentation generator.
          Using the folder structure below, generate a professional README.md that includes:
          - Overview
          - Features
          - Architecture summary
          - Folder structure
          - Setup instructions
          - Running the app
          - Example usage
          - Configuration details
          - Testing instructions
          - Contribution guidelines
          - License section

          Folder structure:
          {folder_tree}
          """

          # Call GPT
          completion = openai.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}]
          )

          output = completion.choices[0].message.content

          with open("README.md", "w") as f:
              f.write(output)
          EOF

      - name: Commit README.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi

          git add README.md
          git commit -m "Auto-update README via GPT"
          git push

