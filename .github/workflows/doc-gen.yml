name: Auto-Generate README

on:
  push:
    branches:
      - main
      - dev
      - '**'

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install tree command (required to list folders)
      - name: Install tree utility
        run: sudo apt-get update && sudo apt-get install -y tree

      # Generate ACTUAL folder structure
      - name: Generate folder tree
        run: |
          echo "📁 Project Folder Structure" > folder_structure.txt
          echo "--------------------------" >> folder_structure.txt
          tree -a -I '.git|.github|__pycache__|.venv' >> folder_structure.txt

      # Upload folder_structure.txt so you can inspect it
      - name: Upload folder_structure.txt for debugging
        uses: actions/upload-artifact@v4
        with:
          name: folder-structure
          path: folder_structure.txt

      - name: Install OpenAI SDK
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install openai

      - name: Generate README using OpenAI GPT
        run: |
          python3 - << 'EOF'
          import os
          import openai

          openai.api_key = os.getenv("OPENAI_API_KEY")

          with open("folder_structure.txt") as f:
              folder_tree = f.read()

          prompt = f"""
          You are an expert technical writer.
          Below is my project's actual folder structure.

          Generate a detailed, accurate README.md specific to THIS repo—not a template.

          The README must include:
          - Project overview (deduce purpose from folders)
          - Features
          - Architecture summary
          - Folder structure explanation
          - Setup instructions (use requirements.txt)
          - Running scripts (infer from scripts/, src/)
          - Description of configs/
          - Description of utils/
          - Description of tests/
          - Example usage
          - Contribution guidelines
          - License section

          Folder Structure:
          {folder_tree}
          """

          completion = openai.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}]
          )

          output = completion.choices[0].message.content

          with open("README.md", "w") as f:
              f.write(output)
          EOF

      - name: Commit README.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi

          git add README.md
          git commit -m "Auto-update README via GPT"
          git push